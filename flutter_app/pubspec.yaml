name: ai_trading_signal
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  shared_preferences: 2.5.3

dependency_overrides:
  # Pin the Android Pigeon implementation to the API generation tested with
  # shared_preferences 2.5.3. A runtime registrar signature mismatch can crash
  # before any backend HTTP request is sent.
  shared_preferences_android: 2.4.23
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
