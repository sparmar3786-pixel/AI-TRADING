name: Python and backend tests
on:
  push:
    branches: [main, integrate-trading-research-v2-20261010, feat/live-signal-backend]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and SmartAPI dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run strategy, risk, broker adapter and backend API tests
        run: python -m unittest discover -s tests -v
