name: Python tests
on:
  push:
    branches: [main, integrate-trading-research-v2-20261010]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build backend Docker image
        run: docker build --tag ai-trading-api:ci .
      - name: Smoke-test backend container health
        run: |
          set -euo pipefail
          docker run --detach --name ai-trading-api-ci -p 8080:8080 ai-trading-api:ci
          cleanup() { docker logs ai-trading-api-ci || true; docker rm -f ai-trading-api-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          python - <<'PY'
          import time
          import urllib.request
          last_error = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2) as response:
                      body = response.read().decode()
                      if response.status == 200 and '"status":"ok"' in body.replace(" ", ""):
                          print(body)
                          raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
              time.sleep(2)
          raise SystemExit(f"Backend health smoke test failed: {last_error}")
          PY
