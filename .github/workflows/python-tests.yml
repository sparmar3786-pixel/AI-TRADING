name: AI-TRADING CI

on:
  push:
    branches: [main, integrate-trading-research-v2-20261010, fix/commodity-footprint-ai-provider-ui, fix/enable-python-ci-and-audit, fix/python-ci-discover-existing-tests]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-trading-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: React/Vite source build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify frontend manifest
        run: |
          test -f package.json
          node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts.build) process.exit(1)"
      - name: Synchronize npm lockfile with package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Build production frontend
        run: npm run build

  python-tests:
    name: Python repository regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect Python regression tests
        id: detect
        shell: bash
        run: |
          if [ -d .github/scripts ] && find .github/scripts -maxdepth 1 -type f -name 'test*.py' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No .github/scripts Python regression tests were found."
          fi
      - name: Install quant test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quant.txt
      - name: Run repository Python regression tests
        run: |
          python -m unittest discover -s .github/scripts -p 'test*.py' -v
          python -m unittest discover -s tests -p 'test*.py' -v
      - name: Fail if expected Python tests are missing
        if: steps.detect.outputs.available != 'true'
        run: |
          echo "::error::Python regression tests were not discovered; refusing to report a successful skip."
          exit 1
