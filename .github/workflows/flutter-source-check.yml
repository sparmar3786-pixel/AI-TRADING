name: Flutter source verification (no APK)

on:
  push:
    branches:
      - feat/ai-trading-signal-apk
      - feat/strategy-tab-no-ai
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-source-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-check:
    name: Flutter analysis, tests, and removed-feature guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify repository links, local models, and all AI UI are absent
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'https?://(www\\.)?(github\\.com|githubusercontent\\.com|github\\.io|gitlab\\.com|gitlab\\.io|bitbucket\\.org|sourceforge\\.net|codeberg\\.org|git\\.sr\\.ht|huggingface\\.co)/|Repository Library|Quant Research Hub|Quant & Trading Repositories|PDF Report & Repositories' flutter_app/lib; then
            echo "Repository-link UI or repository URLs remain in active Flutter source."
            exit 1
          fi
          if grep -RniE 'llama_flutter_android|LlamaController|file_picker|\\.gguf|GGUF model|offline Qwen' flutter_app/lib flutter_app/pubspec.yaml; then
            echo "On-device GGUF/Qwen model code or dependency remains in the APK source."
            exit 1
          fi
          if grep -RniE 'AI Access|AI Chat|NVIDIA|Gemini|OpenRouter|/v1/ai/|/v1/providers/ai|Multi-Agent AI|Live AI Validation|AI provider|sentiment with AI|Reflect on closed paper trades with AI|llama_flutter_android|LlamaController|\.gguf|GGUF model|offline Qwen' flutter_app/lib; then
            echo "AI provider/model/chat UI or client endpoint remains in the APK source."
            exit 1
          fi
          if ! grep -Fq 'RepositoryLinkFilter.sanitizeValue(decoded)' flutter_app/lib/api.dart; then
            echo "Global API-response repository-link filtering is missing."
            exit 1
          fi
          grep -Fq "Strategies" flutter_app/lib/main.dart
          grep -Fq "final signalApi = FreshApi.signal();" flutter_app/lib/main.dart
          grep -Fq "signalApi.signals(emaFast: emaFast, emaSlow: emaSlow)" flutter_app/lib/main.dart
          grep -Fq "FreshApi.signal().angelStatus()" flutter_app/lib/main.dart
          grep -Fq "generalApiOnline = await _probeGeneralBackend(api);" flutter_app/lib/main.dart
          grep -Fq "apiOnline = generalApiOnline || signalsEndpointOnline;" flutter_app/lib/main.dart
          echo "Repository-link, AI-removal, strategy-tab, signal-backend routing and independent-health guards passed."
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
