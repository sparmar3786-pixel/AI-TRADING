name: Failed-Move Engine Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "quant/failed_move_fade.py"
      - "tests/test_failed_move_fade.py"
      - ".github/workflows/failed-move-tests.yml"
  push:
    branches: [failed-move-fade-isolated]
    paths:
      - "quant/failed_move_fade.py"
      - "tests/test_failed_move_fade.py"
      - ".github/workflows/failed-move-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failed-move-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine test dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run failed-move regression tests
        run: python -m unittest discover -s tests -p "test_failed_move_fade.py" -v
