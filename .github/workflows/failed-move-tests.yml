name: Quant Strategy Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "quant/**"
      - "tests/test_failed_move_fade.py"
      - "tests/test_hero_zero.py"
      - "tests/test_orb_vwap_engines.py"
      - ".github/workflows/failed-move-tests.yml"
  push:
    branches: [failed-move-fade-isolated, hero-zero-expiry-hardening]
    paths:
      - "quant/**"
      - "tests/test_failed_move_fade.py"
      - "tests/test_hero_zero.py"
      - ".github/workflows/failed-move-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quant-strategy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine test dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run quant strategy regression tests
        run: |
          python -m unittest discover -s tests -p "test_failed_move_fade.py" -v
          python -m unittest discover -s tests -p "test_hero_zero.py" -v
          python -m unittest discover -s tests -p "test_orb_vwap_engines.py" -v
