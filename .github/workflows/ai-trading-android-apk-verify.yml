name: AI-TRADING Android APK verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version
      - name: Generate missing Android platform scaffold
        run: flutter create --platforms=android --project-name ai_trading_signal .
      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          path = kts if kts.exists() else groovy
          if not path.exists():
              raise SystemExit("Android app Gradle file was not generated")

          text = path.read_text()
          if path.suffix == ".kts":
              if "isCoreLibraryDesugaringEnabled = true" not in text:
                  pattern = r"(compileOptions\s*\{)"
                  text, count = re.subn(pattern, r"\1\n        isCoreLibraryDesugaringEnabled = true", text, count=1)
                  if count != 1:
                      raise SystemExit("Could not enable core library desugaring in Kotlin Gradle file")
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if dep not in text:
                  match = re.search(r"dependencies\s*\{", text)
                  if match:
                      text = text[:match.end()] + "\n    " + dep + text[match.end():]
                  else:
                      text += "\n\ndependencies {\n    " + dep + "\n}\n"
          else:
              if "coreLibraryDesugaringEnabled true" not in text:
                  pattern = r"(compileOptions\s*\{)"
                  text, count = re.subn(pattern, r"\1\n        coreLibraryDesugaringEnabled true", text, count=1)
                  if count != 1:
                      raise SystemExit("Could not enable core library desugaring in Groovy Gradle file")
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              if dep not in text:
                  match = re.search(r"dependencies\s*\{", text)
                  if match:
                      text = text[:match.end()] + "\n    " + dep + text[match.end():]
                  else:
                      text += "\n\ndependencies {\n    " + dep + "\n}\n"
          path.write_text(text)
          print(f"Enabled core library desugaring in {path}")
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-trading-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
