name: Build AI-TRADING Android APK

on:
  # Build a test APK for reviewed changes before merge, and publish the rolling APK on main.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'flutter_app/**'
      - 'quant/**'
      - 'requirements-quant.txt'
  push:
    branches: [main, feat/ai-trading-signal-apk, feat/strategy-tab-no-ai]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'flutter_app/**'
      - 'quant/**'
      - 'requirements-quant.txt'
  workflow_dispatch:

permissions:
  contents: write

# Give each workflow run its own concurrency group so a newer push cannot supersede an older queued/running APK build.
# GitHub may queue runs when runner capacity is limited, but this workflow will not cancel sibling runs.
# Use a unique group per run. GitHub otherwise keeps only one pending run per group and can replace older pending runs even with cancel-in-progress=false.
concurrency:
  group: ai-trading-apk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure flutter_app directory exists
        working-directory: .
        run: |
          set -euo pipefail
          if [ ! -f "flutter_app/pubspec.yaml" ]; then
            echo "flutter_app missing on current branch; attempting to restore it from feat/ai-trading-signal-apk..."
            git checkout origin/feat/ai-trading-signal-apk -- flutter_app
          fi
          test -f "flutter_app/pubspec.yaml" || { echo "Flutter source/pubspec.yaml is missing; refusing to continue with an empty APK build."; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Install Android command-line tools explicitly so sdkmanager is always
      # available before Gradle/Flutter Android configuration starts.
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools'
      - name: Verify Android SDK tools
        run: |
          set -euo pipefail
          ANDROID_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_ROOT/cmdline-tools/latest/bin:$ANDROID_ROOT/platform-tools:$PATH"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          command -v sdkmanager
          sdkmanager --version
      # Preinstall the Flutter-matched NDK with retries. Android Gradle Plugin
      # otherwise attempts an implicit install during configuration; a truncated
      # SDK archive then aborts the entire APK build before compilation starts.
      - name: Install Android NDK with retry
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          installed=false
          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            if [ -x "$NDK_DIR/ndk-build" ]; then
              installed=true
              break
            fi
            rm -rf "$NDK_DIR"
            timeout 20s bash -c 'yes | sdkmanager --licenses >/dev/null' || true
            if timeout 90s sdkmanager --install "ndk;$NDK_VERSION" && [ -x "$NDK_DIR/ndk-build" ]; then
              installed=true
              break
            fi
            echo "NDK install attempt $attempt failed; clearing partial package before retry."
            rm -rf "$NDK_DIR"
            sleep $((attempt * 5))
          done
          if [ "$installed" != true ]; then
            echo "Could not install a complete NDK $NDK_VERSION after 3 attempts."
            exit 1
          fi
          "$NDK_DIR/ndk-build" --version
      - name: Bootstrap Android platform
        working-directory: flutter_app
        run: flutter create --platforms=android --project-name ai_trading_signal .
      - name: Enforce Android minSdk 26
        working-directory: flutter_app
        run: |
          set -euo pipefail
          GRADLE="android/app/build.gradle.kts"
          if [ ! -f "$GRADLE" ]; then
            echo "Generated Android Gradle file missing: $GRADLE"
            find android -maxdepth 4 -type f -print | sort || true
            exit 1
          fi

          # Handle both Flutter's generated default and an explicit older integer.
          if grep -Eq 'minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion' "$GRADLE"; then
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 26/' "$GRADLE"
          else
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 26/' "$GRADLE"
          fi

          grep -Eq 'minSdk[[:space:]]*=[[:space:]]*26([[:space:]]|$)' "$GRADLE" || {
            echo "Could not enforce minSdk 26 for llama_flutter_android"
            exit 1
          }
          grep -n 'minSdk' "$GRADLE"

      - name: Test and configure Android core library desugaring
        working-directory: .
        run: |
          set -euo pipefail
          python3 .github/scripts/test_ensure_android_desugaring.py
          python3 .github/scripts/ensure_android_desugaring.py
          grep -nE 'isCoreLibraryDesugaringEnabled|coreLibraryDesugaring' flutter_app/android/app/build.gradle.kts
      - name: Add Android network permissions
        working-directory: flutter_app
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application#' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.FOREGROUND_SERVICE' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$MANIFEST"
          fi
          if ! grep -q 'id.flutter.flutter_background_service.BackgroundService' "$MANIFEST"; then
            sed -i 's#</application>#<service android:name="id.flutter.flutter_background_service.BackgroundService" android:foregroundServiceType="dataSync" android:exported="true" />\n    </application>#' "$MANIFEST"
          fi
          # Flutter may generate a default label or restore an existing label from the release branch.
          # Normalize any existing application label, not just the template default.
          sed -i -E 's/android:label="[^"]*"/android:label="Trading Signals"/' "$MANIFEST"
          grep -F 'android:label="Trading Signals"' "$MANIFEST"
          GRADLE=android/app/build.gradle.kts
          sed -i 's/applicationId = "com.example.ai_trading_signal"/applicationId = "com.sparmar3786.aitradingsignals"/' "$GRADLE"
          grep -n 'applicationId\|minSdk' "$GRADLE"
          grep -n 'uses-permission' "$MANIFEST"
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Verify removed chart pages are absent from Flutter source
        working-directory: flutter_app
        run: |
          set -euo pipefail
          if grep -RniE 'SMC Pro Chart|SMC Chart|Smart Money Concepts Chart|Order Flow & Footprint|Order Flow Chart|Footprint Chart|FOOTPRINT CHART|class OrderFlowPage|MCX|Commodities|CRUDEOIL|NATURALGAS|CommodityPage' lib; then
            echo "Removed SMC, Order Flow, or MCX UI is still present in Flutter source."
            exit 1
          fi
      - name: Verify AI pages and provider UI are absent
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'AI Access|AI Memory|Market Intelligence|AI Chat|AI Provider|DailyAiMemory|nvidia_signal_review|daily_ai_memory_page|market_intelligence_page' lib; then
            echo "Removed AI page/provider UI or AI-memory implementation remains in active Flutter source."
            exit 1
          fi
          if grep -Eq "'AI Access'|'AI Memory'|'Market Intelligence'|'AI Chat'|'AI Providers?'" lib/main.dart; then
            echo "An AI-specific navigation tab remains in main.dart."
            exit 1
          fi
          grep -F "'Strategies'" lib/main.dart >/dev/null
          if grep -F "'API & Railway'" lib/main.dart || grep -F "class ApiRailwayPage" lib/main.dart; then
            echo "Removed API & Railway reference screen remains in Flutter source."
            exit 1
          fi
          grep -F "BacktestingPage(backendUrl: AppConfig.signalBackendUrl)" lib/main.dart >/dev/null
          echo "AI pages/provider integrations and API & Railway reference screen absent; backtesting uses the AI-TRADING signal backend."

      - name: Analyze Dart
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
      - name: Widget and API tests
        working-directory: flutter_app
        run: flutter test
      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release --no-tree-shake-icons --dart-define=BACKEND_URL=https://nse-algo-backend-final-production.up.railway.app --dart-define=SIGNAL_BACKEND_URL=https://ai-trading-signals-api-production.up.railway.app
      - name: Build optimized ARM64 APK
        working-directory: flutter_app
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          cp "$APK_DIR/app-release.apk" /tmp/ai-trading-universal.apk
          flutter build apk --release --split-per-abi --no-tree-shake-icons --dart-define=BACKEND_URL=https://nse-algo-backend-final-production.up.railway.app --dart-define=SIGNAL_BACKEND_URL=https://ai-trading-signals-api-production.up.railway.app
          test -s "$APK_DIR/app-arm64-v8a-release.apk"
          cp /tmp/ai-trading-universal.apk "$APK_DIR/app-release.apk"
          ls -lh "$APK_DIR/app-release.apk" "$APK_DIR/app-arm64-v8a-release.apk"
      - name: Verify APK configuration and signal-only safety
        working-directory: flutter_app
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          UNIVERSAL="$APK_DIR/app-release.apk"
          ARM64="$APK_DIR/app-arm64-v8a-release.apk"
          test -s "$UNIVERSAL"
          test -s "$ARM64"

          # Do not require Dart AOT binaries to preserve full URL literals.
          # Flutter's AOT compiler can omit/fold constants, so validate the
          # compile-time defines and their consumers in source instead.
          WORKFLOW="../.github/workflows/android-apk.yml"
          CONFIG="lib/config.dart"
          API="lib/api.dart"
          grep -F -- '--dart-define=BACKEND_URL=https://nse-algo-backend-final-production.up.railway.app' "$WORKFLOW" >/dev/null || {
            echo "Build configuration missing BACKEND_URL define"
            exit 1
          }
          grep -F -- '--dart-define=SIGNAL_BACKEND_URL=https://ai-trading-signals-api-production.up.railway.app' "$WORKFLOW" >/dev/null || {
            echo "Build configuration missing SIGNAL_BACKEND_URL define"
            exit 1
          }
          grep -F "String.fromEnvironment(" "$CONFIG" >/dev/null
          grep -F "'BACKEND_URL'" "$CONFIG" >/dev/null
          grep -F "'SIGNAL_BACKEND_URL'" "$CONFIG" >/dev/null
          grep -F "AppConfig.backendUrl" "$API" >/dev/null
          grep -F "AppConfig.signalBackendUrl" "$API" >/dev/null
          echo "Compile-time backend defines and Dart consumers verified."

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -1)
          for APK in "$UNIVERSAL" "$ARM64"; do
            mapfile -t CODE_FILES < <(unzip -Z1 "$APK" | grep -E '(^classes[0-9]*[.]dex$|^lib/[^/]+/libapp[.]so$)' || true)
            test "${#CODE_FILES[@]}" -gt 0
            COMPILED_STRINGS=$(for file in "${CODE_FILES[@]}"; do unzip -p "$APK" "$file" | strings; done)
            if printf '%s\n' "$COMPILED_STRINGS" | grep -Ei 'SMC Pro Chart|SMC Chart|Smart Money Concepts Chart|Order Flow & Footprint|Order Flow Chart|Footprint Chart|FOOTPRINT CHART|class OrderFlowPage|CommodityPage' >/dev/null; then
              echo "Removed SMC, Order Flow, or MCX UI found in $APK"
              exit 1
            fi
            if printf '%s\n' "$COMPILED_STRINGS" | grep -E 'http://10[.]0[.]2[.]2:8000|http://localhost:8000|http://127[.]0[.]0[.]1:8000' >/dev/null; then
              echo "Forbidden local/emulator backend URL found in $APK"
              exit 1
            fi
            # URL literals are intentionally not grepped from Dart AOT output;
            # the compile-time defines and their source consumers were checked above.
            if printf '%s\n' "$COMPILED_STRINGS" | grep -E 'OPENAI_API_KEY|OPEN_AI_API_KEY|OPENAI_MODEL|api[.]openai[.]com' >/dev/null; then
              echo "Direct OpenAI provider configuration unexpectedly found in $APK"
              exit 1
            fi
            if printf '%s\n' "$COMPILED_STRINGS" | grep -E '/v1/live/execute-signal|PLACE_REAL_ANGEL_ORDER|PLACE REAL ANGEL ONE ORDER' >/dev/null; then
              echo "Order-placement capability unexpectedly found in APK"
              exit 1
            fi
            if ! "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
              echo "Internet permission missing from $APK"
              exit 1
            fi
            if ! "$AAPT" dump badging "$APK" | grep -F "application-label:'Trading Signals'" >/dev/null; then
              echo "Expected Trading Signals app label missing from $APK"
              "$AAPT" dump badging "$APK" | grep 'application-label' || true
              exit 1
            fi
          done
          # Generate checksums from the exact verified APK bytes.
          sha256sum "$UNIVERSAL" > "$UNIVERSAL.sha256"
          sha256sum "$ARM64" > "$ARM64.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$(dirname "$UNIVERSAL")/BUILD_COMMIT_SHA.txt"
          printf 'workflow_run_id=%s\nworkflow_run_number=%s\ncommit_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > "$(dirname "$UNIVERSAL")/BUILD_INFO.txt"
          # Verify both generated checksum manifests before any artifact/release upload.
          sha256sum -c "$UNIVERSAL.sha256"
          sha256sum -c "$ARM64.sha256"
          test "$(cat "$(dirname "$UNIVERSAL")/BUILD_COMMIT_SHA.txt")" = "$GITHUB_SHA"
          grep -F "commit_sha=$GITHUB_SHA" "$(dirname "$UNIVERSAL")/BUILD_INFO.txt"
          cat "$UNIVERSAL.sha256" "$ARM64.sha256"
          ls -lh "$UNIVERSAL" "$ARM64" "$UNIVERSAL.sha256" "$ARM64.sha256" "$(dirname "$UNIVERSAL")/BUILD_COMMIT_SHA.txt" "$(dirname "$UNIVERSAL")/BUILD_INFO.txt"
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-trading-apk-${{ github.run_number }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-release.apk.sha256
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
            flutter_app/build/app/outputs/flutter-apk/BUILD_COMMIT_SHA.txt
            flutter_app/build/app/outputs/flutter-apk/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling APK release (and upload APK artifacts)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api repos/sparmar3786-pixel/AI-TRADING/commits/main --jq .sha)
          if [ "$GITHUB_SHA" != "$LATEST_SHA" ]; then
            echo "Skipping release upload for stale commit $GITHUB_SHA; main is now $LATEST_SHA"
            exit 0
          fi
          # Concurrent older builds must never overwrite the rolling release for a newer main commit.
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          if [ -z "$CURRENT_MAIN_SHA" ]; then
            echo "Could not verify current main SHA; refusing to publish a possibly stale APK"
            exit 1
          fi
          if [ "$CURRENT_MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping release publish for stale commit $GITHUB_SHA; current main is $CURRENT_MAIN_SHA"
            exit 0
          fi
          TAG="ai-trading-signal-latest"
          APK="flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          ARM64_APK="flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          NOTES="Build commit: $GITHUB_SHA | Workflow run: $GITHUB_RUN_ID. Universal signal-only Android APK for broad ABI compatibility; app-arm64-v8a-release.apk is the smaller optimized build for 64-bit ARM Android phones. Uses the dedicated AI-TRADING Railway market-data and Angel One signals API without AI-provider or AI-chat features. Signals require fresh exchange-timestamped evidence and continuous 10-minute same-side/same-strike confirmation. No broker order-placement API is included in the APK. Configure Angel One credentials in the app over HTTPS; validate on-device and paper-trade before relying on signals."
          # Existing GitHub releases do not reliably move an already-created Git tag
          # when only the release metadata is edited. Move the tag ref explicitly to
          # the verified build commit before uploading artifacts, then verify resolution.
          if [ "$(gh api repos/sparmar3786-pixel/AI-TRADING/commits/main --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "main advanced during release publication; refusing to move the rolling tag"
            exit 0
          fi
          if gh api "repos/sparmar3786-pixel/AI-TRADING/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/sparmar3786-pixel/AI-TRADING/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST repos/sparmar3786-pixel/AI-TRADING/git/refs -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$ARM64_APK" "$APK.sha256" "$ARM64_APK.sha256" "$(dirname "$APK")/BUILD_COMMIT_SHA.txt" "$(dirname "$APK")/BUILD_INFO.txt" --clobber
            gh release edit "$TAG" --title "AI-TRADING Signal APK" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" "$ARM64_APK" "$APK.sha256" "$ARM64_APK.sha256" "$(dirname "$APK")/BUILD_COMMIT_SHA.txt" "$(dirname "$APK")/BUILD_INFO.txt" --title "AI-TRADING Signal APK" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          RELEASE_COMMIT_SHA=$(gh api "repos/sparmar3786-pixel/AI-TRADING/commits/$TAG" --jq .sha)
          if [ "$RELEASE_COMMIT_SHA" != "$GITHUB_SHA" ]; then
            echo "Rolling release tag resolves to $RELEASE_COMMIT_SHA, expected $GITHUB_SHA"
            exit 1
          fi
          if [ "$(cat "$(dirname "$APK")/BUILD_COMMIT_SHA.txt")" != "$GITHUB_SHA" ]; then
            echo "APK build metadata does not match the verified source commit"
            exit 1
          fi
