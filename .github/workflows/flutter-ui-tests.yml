name: Flutter UI regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-ui-tests.yml"
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Run widget and API tests
        run: flutter test
